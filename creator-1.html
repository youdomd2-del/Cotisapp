<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CotisApp — Panneau Créateur</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#040408;--deep:#080810;--surface:#0f0f1c;--elevated:#161625;
  --gold:#c9a84c;--gold-l:#e8c97a;--gold-dim:rgba(201,168,76,0.12);
  --gold-glow:rgba(201,168,76,0.06);
  --text:#f0ede8;--muted:#6b6880;--sub:#2d2b3d;
  --green:#2ecc71;--red:#e74c3c;--orange:#f39c12;
  --serif:'Cormorant Garamond',serif;--sans:'Outfit',sans-serif;--mono:'DM Mono',monospace;
}
html,body{background:var(--void);min-height:100vh;}
body{font-family:var(--sans);color:var(--text);display:flex;justify-content:center;}
#root{width:100%;max-width:480px;min-height:100vh;background:var(--deep);position:relative;overflow:hidden;}

#root::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(201,168,76,0.05) 0%,transparent 70%);pointer-events:none;z-index:0;}

.screen{min-height:100vh;padding-bottom:60px;display:flex;flex-direction:column;animation:si .4s cubic-bezier(.16,1,.3,1);position:relative;z-index:1;}
@keyframes si{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.hdr{padding:24px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,16,0.9);backdrop-filter:blur(20px);position:sticky;top:0;z-index:20;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--gold-l));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.logo-text{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.02em;}
.logo-text em{color:var(--gold);font-style:normal;}
.creator-pill{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,168,76,0.25);padding:4px 12px;border-radius:100px;background:var(--gold-dim);}

/* LOGIN */
.login-wrap{flex:1;padding:60px 28px 40px;display:flex;flex-direction:column;}
.login-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.login-eyebrow::before{content:'';width:20px;height:1px;background:var(--gold);}
.login-title{font-family:var(--serif);font-size:52px;font-weight:300;line-height:1.05;margin-bottom:12px;letter-spacing:-.5px;}
.login-title em{color:var(--gold);font-style:italic;}
.login-sub{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:40px;font-weight:300;}

/* INPUTS */
.field{margin-bottom:14px;}
.field-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px;}
.field-inp{width:100%;padding:14px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;color:var(--text);font-family:var(--mono);font-size:14px;outline:none;transition:border-color .2s,background .2s;}
.field-inp:focus{border-color:rgba(201,168,76,0.35);background:rgba(201,168,76,0.03);}
.field-inp::placeholder{color:var(--sub);}
.field-inp.key-f{letter-spacing:.08em;text-transform:uppercase;}

/* BUTTONS */
.btn-gold{width:100%;padding:16px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#0d0a00;border:none;border-radius:12px;font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 20px rgba(201,168,76,.2);}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(201,168,76,.3);}
.btn-gold:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-copy{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.2);padding:5px 12px;border-radius:8px;font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .2s;}
.btn-copy:hover{background:rgba(201,168,76,.2);}
.btn-revoke{background:rgba(231,76,60,.08);color:var(--red);border:1px solid rgba(231,76,60,.15);padding:5px 12px;border-radius:8px;font-family:var(--mono);font-size:10px;cursor:pointer;}

/* PANEL */
.panel-wrap{padding:24px;display:flex;flex-direction:column;gap:20px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;}
.stat-val{font-family:var(--serif);font-size:28px;font-weight:300;letter-spacing:-.5px;margin-bottom:4px;}
.stat-val.gold{color:var(--gold);}
.stat-val.green{color:var(--green);}
.stat-val.orange{color:var(--orange);}
.stat-val.red{color:var(--red);}
.stat-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

.panel-section{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:20px;}
.panel-title{font-size:13px;font-weight:600;letter-spacing:-.2px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.panel-title::before{content:'';width:3px;height:16px;background:linear-gradient(var(--gold),var(--gold-l));border-radius:2px;flex-shrink:0;}

.new-key-box{background:rgba(201,168,76,.05);border:1px solid rgba(201,168,76,.2);border-radius:12px;padding:16px;margin-top:14px;display:none;}
.new-key-box.show{display:block;}
.new-key-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.new-key-val{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--text);letter-spacing:.12em;margin-bottom:8px;word-break:break-all;}
.new-key-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6;}

.filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{padding:6px 14px;border:1px solid rgba(255,255,255,.07);border-radius:100px;font-family:var(--mono);font-size:10px;background:none;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.04em;}
.filter-btn.active{background:var(--gold-dim);color:var(--gold);border-color:rgba(201,168,76,.3);}

.keys-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;}
.keys-list::-webkit-scrollbar{width:3px;}
.keys-list::-webkit-scrollbar-track{background:transparent;}
.keys-list::-webkit-scrollbar-thumb{background:var(--sub);border-radius:100px;}

.key-item{background:var(--elevated);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;transition:border-color .2s;}
.key-item:hover{border-color:rgba(201,168,76,.15);}
.key-item.active-k{border-color:rgba(46,204,113,.15);}
.key-item.expired-k{opacity:.5;}
.key-item.revoked-k{opacity:.35;}
.key-code{font-family:var(--mono);font-size:12px;color:var(--text);letter-spacing:.06em;word-break:break-all;margin-bottom:4px;}
.key-group{font-family:var(--mono);font-size:10px;color:var(--muted);}
.key-date{font-family:var(--mono);font-size:9px;color:var(--sub);margin-top:4px;}

.chip-k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:6px;}
.chip-k.active{background:rgba(46,204,113,.1);color:var(--green);border:1px solid rgba(46,204,113,.2);}
.chip-k.expired{background:rgba(231,76,60,.08);color:var(--red);border:1px solid rgba(231,76,60,.15);}
.chip-k.revoked{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid rgba(255,255,255,.06);}
.chip-k.unused{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(201,168,76,.2);}

.empty-k{text-align:center;padding:32px;font-family:var(--mono);font-size:11px;color:var(--sub);line-height:1.8;}

.notif{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:14px 20px;text-align:center;font-family:var(--mono);font-size:12px;z-index:999;backdrop-filter:blur(12px);letter-spacing:.04em;}
.notif.s{background:rgba(46,204,113,.92);color:#fff;}
.notif.e{background:rgba(231,76,60,.92);color:#fff;}
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace;color:#333;font-size:13px">Chargement…</div>
</div>
<script>
var firebaseConfig={apiKey:"AIzaSyBWYo9uz-ELYY-zouXT0-lyNXOrBBjZ8tU",authDomain:"cotisapp.firebaseapp.com",databaseURL:"https://cotisapp-default-rtdb.firebaseio.com",projectId:"cotisapp",storageBucket:"cotisapp.firebasestorage.app",messagingSenderId:"817783273140",appId:"1:817783273140:web:049a9cea3c86b3c0f9d8f4"};
var CREATOR_PWD="YOUDOM-MASTER-2026",CREATOR="David Youdom";
var db=null,allKeys={},loggedIn=false,filter="all",lastKey=null,grpName="";

firebase.initializeApp(firebaseConfig);
db=firebase.database();

function genKey(){
  var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",a="",b="";
  for(var i=0;i<4;i++)a+=c[Math.floor(Math.random()*c.length)];
  for(var i=0;i<4;i++)b+=c[Math.floor(Math.random()*c.length)];
  return"YOUDOM-2026-"+a+"-"+b;
}
function addM(d,m){var x=new Date(d);x.setMonth(x.getMonth()+m);return x.toISOString();}
function fDate(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});}
function kStatus(k){if(k.revoked)return"revoked";if(!k.activatedAt)return"unused";if(new Date()>new Date(k.expiresAt))return"expired";return"active";}
function sLabel(s){return s==="active"?"✅ Actif":s==="expired"?"⏰ Expiré":s==="revoked"?"🚫 Révoqué":"🔑 Non activé";}

function showN(msg,type){
  var old=document.querySelector(".notif");if(old)old.remove();
  var el=document.createElement("div");el.className="notif "+(type||"s");el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){el.style.opacity="0";setTimeout(function(){el.remove();},400);},3000);
}

function login(){
  var pw=document.getElementById("pwd");if(!pw)return;
  if(pw.value===CREATOR_PWD){
    loggedIn=true;
    db.ref("licenses").on("value",function(snap){allKeys=snap.exists()?snap.val():{};renderPanel();});
  }else{showN("Mot de passe incorrect","e");pw.value="";}
}

function createKey(){
  var gn=grpName.trim()||"Groupe sans nom";
  var key=genKey();
  var now=new Date().toISOString();
  var data={key:key,groupName:gn,createdAt:now,activatedAt:null,expiresAt:null,revoked:false,createdBy:CREATOR};
  db.ref("licenses/"+key.replace(/-/g,"_")).set(data).then(function(){lastKey=data;grpName="";renderPanel();showN("✅ Clé créée pour "+gn);});
}

function revokeKey(id){
  if(!confirm("Révoquer cette clé ?"))return;
  db.ref("licenses/"+id).update({revoked:true}).then(function(){showN("🚫 Clé révoquée");});
}

function copyKey(k){navigator.clipboard.writeText(k).catch(function(){});showN("📋 Clé copiée !");}

function render(){
  var root=document.getElementById("root");if(!root)return;
  root.innerHTML=loggedIn?renderPanel():renderLogin();
  bindEv();
}

function renderLogin(){
  return'<div class="screen">'+
  '<div class="hdr"><div class="logo"><div class="logo-icon">🏦</div><span class="logo-text">Cotis<em>App</em></span></div><span class="creator-pill">Créateur</span></div>'+
  '<div class="login-wrap">'+
  '<div class="login-eyebrow">Accès restreint</div>'+
  '<h1 class="login-title">Panneau<br><em>Créateur</em></h1>'+
  '<p class="login-sub">Réservé à <strong style="color:var(--text)">'+CREATOR+'</strong>.<br>Entre le mot de passe maître pour gérer les licences.</p>'+
  '<div class="field"><label class="field-lbl">Mot de passe maître</label><input id="pwd" type="password" class="field-inp" placeholder="YOUDOM-MASTER-****" style="letter-spacing:.1em"/></div>'+
  '<button class="btn-gold" id="btn-login">🔐 Accéder</button>'+
  '</div></div>';
}

function renderPanel(){
  var keys=Object.entries(allKeys);
  var filtered=keys.filter(function(e){return filter==="all"||kStatus(e[1])===filter;});
  var aC=keys.filter(function(e){return kStatus(e[1])==="active";}).length;
  var uC=keys.filter(function(e){return kStatus(e[1])==="unused";}).length;
  var eC=keys.filter(function(e){return kStatus(e[1])==="expired";}).length;
  var tC=keys.length;

  var newBox="";
  if(lastKey){
    newBox='<div class="new-key-box show">'+
    '<div class="new-key-lbl">🎉 Nouvelle clé</div>'+
    '<div class="new-key-val">'+lastKey.key+'</div>'+
    '<div class="new-key-meta">Groupe : '+lastKey.groupName+'<br>Expire 6 mois après activation</div>'+
    '<button class="btn-gold" id="btn-copy-new">📋 Copier la clé</button>'+
    '</div>';
  }

  var keyItems=filtered.length===0?'<div class="empty-k">Aucune clé<br>dans cette catégorie</div>':
  filtered.map(function(e){
    var k=e[1],id=e[0],st=kStatus(k);
    var di=st==="active"?"Expire le "+fDate(k.expiresAt):st==="unused"?"Créée le "+fDate(k.createdAt):st==="expired"?"Expirée le "+fDate(k.expiresAt):"Révoquée";
    return'<div class="key-item '+(st==="active"?"active-k":st==="expired"?"expired-k":st==="revoked"?"revoked-k":"")+'">'+
    '<div style="flex:1;min-width:0"><div class="key-code">'+k.key+'</div><div class="key-group">'+(k.groupName||"—")+'</div><div class="key-date">'+di+'</div></div>'+
    '<div style="text-align:right;flex-shrink:0">'+
    '<div><span class="chip-k '+st+'">'+sLabel(st)+'</span></div>'+
    (st!=="revoked"&&st!=="expired"?'<button class="btn-revoke" data-id="'+id+'">Révoquer</button><br>':"")+
    '<button class="btn-copy" style="margin-top:4px" data-copy="'+k.key+'">Copier</button>'+
    '</div></div>';
  }).join("");

  var html='<div class="screen">'+
  '<div class="hdr"><div class="logo"><div class="logo-icon">🏦</div><span class="logo-text">Cotis<em>App</em></span></div><span class="creator-pill">'+CREATOR+'</span></div>'+
  '<div class="panel-wrap">'+

  '<div class="stat-grid">'+
  '<div class="stat-card"><div class="stat-val gold">'+tC+'</div><div class="stat-lbl">Total clés</div></div>'+
  '<div class="stat-card"><div class="stat-val green">'+aC+'</div><div class="stat-lbl">Actives</div></div>'+
  '<div class="stat-card"><div class="stat-val orange">'+uC+'</div><div class="stat-lbl">Non activées</div></div>'+
  '<div class="stat-card"><div class="stat-val red">'+eC+'</div><div class="stat-lbl">Expirées</div></div>'+
  '</div>'+

  '<div class="panel-section">'+
  '<div class="panel-title">Générer une clé</div>'+
  '<div class="field"><label class="field-lbl">Nom du groupe</label><input id="gn" class="field-inp" placeholder="Ex: Famille Mbarga" value="'+grpName+'"/></div>'+
  '<button class="btn-gold" id="btn-gen">⚡ Générer</button>'+
  newBox+
  '</div>'+

  '<div class="panel-section">'+
  '<div class="panel-title">Toutes les clés</div>'+
  '<div class="filter-row">'+
  '<button class="filter-btn'+(filter==="all"?" active":"")+'" data-f="all">Toutes ('+tC+')</button>'+
  '<button class="filter-btn'+(filter==="active"?" active":"")+'" data-f="active">Actives ('+aC+')</button>'+
  '<button class="filter-btn'+(filter==="unused"?" active":"")+'" data-f="unused">Non activées ('+uC+')</button>'+
  '<button class="filter-btn'+(filter==="expired"?" active":"")+'" data-f="expired">Expirées ('+eC+')</button>'+
  '</div>'+
  '<div class="keys-list">'+keyItems+'</div>'+
  '</div>'+

  '<div style="text-align:center;font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:.06em">🔥 Firebase — '+CREATOR+'</div>'+
  '</div></div>';

  document.getElementById("root").innerHTML=html;
  bindEv();
  return html;
}

function bindEv(){
  var el;
  el=document.getElementById("btn-login");if(el)el.addEventListener("click",login);
  el=document.getElementById("pwd");if(el)el.addEventListener("keydown",function(e){if(e.key==="Enter")login();});
  el=document.getElementById("btn-gen");if(el)el.addEventListener("click",function(){var g=document.getElementById("gn");grpName=g?g.value:"";createKey();});
  el=document.getElementById("gn");if(el)el.addEventListener("input",function(e){grpName=e.target.value;});
  el=document.getElementById("btn-copy-new");if(el&&lastKey)el.addEventListener("click",function(){copyKey(lastKey.key);});
  document.querySelectorAll(".filter-btn").forEach(function(b){b.addEventListener("click",function(){filter=b.dataset.f;renderPanel();});});
  document.querySelectorAll(".btn-revoke").forEach(function(b){b.addEventListener("click",function(){revokeKey(b.dataset.id);});});
  document.querySelectorAll(".btn-copy[data-copy]").forEach(function(b){b.addEventListener("click",function(){copyKey(b.dataset.copy);});});
}

window.addEventListener("DOMContentLoaded",function(){render();});
</script>
</body>
</html>
