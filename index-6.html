<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>CotisApp — Tontine Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --void: #080810;
  --deep: #0d0d1a;
  --surface: #12121f;
  --elevated: #1a1a2e;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: rgba(201,168,76,0.15);
  --gold-glow: rgba(201,168,76,0.08);
  --text: #f0ede8;
  --text-muted: #6b6880;
  --text-sub: #3d3a50;
  --accent-green: #2ecc71;
  --accent-red: #e74c3c;
  --accent-orange: #f39c12;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Outfit', sans-serif;
  --mono: 'DM Mono', monospace;
}

html { background: var(--void); }
body { background: var(--void); display: flex; justify-content: center; min-height: 100vh; font-family: var(--sans); color: var(--text); }
#root { width: 100%; max-width: 420px; min-height: 100vh; background: var(--deep); position: relative; overflow: hidden; }

/* ── AMBIENT GLOW ── */
#root::before {
  content: '';
  position: fixed;
  top: -200px; left: 50%; transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(201,168,76,0.06) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

.screen {
  min-height: 100vh;
  padding-bottom: 60px;
  display: flex;
  flex-direction: column;
  animation: screenIn 0.4s cubic-bezier(0.16,1,0.3,1);
  position: relative; z-index: 1;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── TOP BAR ── */
.top-bar {
  padding: 20px 24px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--glass-border);
  position: sticky; top: 0; z-index: 20;
  background: rgba(13,13,26,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.logo {
  display: flex; align-items: center; gap: 8px;
}
.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.logo-text {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text);
}
.logo-text em { color: var(--gold); font-style: normal; }

.top-right { display: flex; align-items: center; gap: 10px; }

.role-badge {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid rgba(201,168,76,0.3);
  padding: 4px 10px;
  border-radius: 100px;
  background: var(--gold-glow);
}

.btn-exit {
  font-family: var(--mono);
  font-size: 10px;
  background: none;
  border: 1px solid var(--glass-border);
  color: var(--text-muted);
  padding: 5px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.04em;
}
.btn-exit:hover { border-color: var(--accent-red); color: var(--accent-red); }

/* ── TABS ── */
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--glass-border);
  background: rgba(13,13,26,0.7);
  backdrop-filter: blur(12px);
  position: sticky; top: 73px; z-index: 19;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 1; padding: 13px 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: none; border: none;
  color: var(--text-sub);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 1.5px solid transparent;
  transition: all 0.2s;
  min-width: fit-content;
}
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── APP BODY ── */
.app-body { padding: 24px 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }

/* ── LICENSE SCREEN ── */
.license-screen {
  flex: 1; padding: 0;
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}

.license-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.08) 0%, transparent 60%);
}

.license-content {
  position: relative; z-index: 1;
  padding: 60px 28px 40px;
  flex: 1; display: flex; flex-direction: column;
}

.lic-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.lic-eyebrow::before {
  content: '';
  width: 24px; height: 1px;
  background: var(--gold);
}

.lic-title {
  font-family: var(--serif);
  font-size: 52px;
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -0.5px;
  color: var(--text);
  margin-bottom: 16px;
}
.lic-title em { color: var(--gold); font-style: italic; }

.lic-sub {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.7;
  margin-bottom: 40px;
  font-weight: 300;
}

.lic-error {
  background: rgba(231,76,60,0.08);
  border: 1px solid rgba(231,76,60,0.2);
  border-radius: 12px;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 11px;
  color: #e74c3c;
  margin-bottom: 20px;
  letter-spacing: 0.02em;
}

.lic-footer {
  margin-top: auto;
  padding-top: 32px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-sub);
  text-align: center;
  letter-spacing: 0.06em;
}
.lic-footer strong { color: var(--gold); }

/* ── CGU SCREEN ── */
.cgu-content {
  flex: 1; padding: 40px 24px;
}
.section-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 24px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }

.cgu-heading {
  font-family: var(--serif);
  font-size: 44px;
  font-weight: 300;
  line-height: 1.1;
  margin-bottom: 40px;
  letter-spacing: -0.5px;
}
.cgu-heading em { color: var(--gold); font-style: italic; }

.cgu-item {
  border-top: 1px solid var(--glass-border);
  padding: 20px 0;
  display: flex; gap: 16px;
}
.cgu-item:last-of-type { border-bottom: 1px solid var(--glass-border); margin-bottom: 32px; }
.cgu-num-big {
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 300;
  color: var(--text-sub);
  line-height: 1;
  flex-shrink: 0;
  width: 40px;
}
.cgu-item-body {}
.cgu-item-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.2px; }
.cgu-item-text { font-size: 12px; color: var(--text-muted); line-height: 1.65; font-weight: 300; }

/* ── PORTAL SCREEN ── */
.portal-content { flex: 1; padding: 50px 24px 40px; display: flex; flex-direction: column; }
.portal-tag {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 16px;
}
.portal-heading {
  font-family: var(--serif);
  font-size: 58px;
  font-weight: 300;
  line-height: 0.95;
  letter-spacing: -1px;
  margin-bottom: 48px;
}
.portal-heading .outline {
  color: transparent;
  -webkit-text-stroke: 1px rgba(240,237,232,0.3);
}
.portal-heading .gold { color: var(--gold); font-style: italic; }

.sep {
  display: flex; align-items: center; gap: 12px;
  margin: 20px 0;
}
.sep-line { flex: 1; height: 1px; background: var(--glass-border); }
.sep-text { font-family: var(--mono); font-size: 10px; color: var(--text-sub); letter-spacing: 0.1em; }

.pin-warn {
  font-family: var(--mono); font-size: 11px;
  margin-top: 8px; letter-spacing: 0.03em;
}
.pin-warn.r { color: var(--accent-red); }
.pin-warn.o { color: var(--accent-orange); }

.portal-hint {
  font-family: var(--mono); font-size: 10px;
  color: var(--text-sub); text-align: center;
  margin-top: 20px; letter-spacing: 0.04em;
}

/* ── INPUTS ── */
.field { margin-bottom: 14px; }
.field-lbl {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block; margin-bottom: 8px;
}
.field-inp {
  width: 100%;
  padding: 14px 16px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.field-inp:focus {
  border-color: rgba(201,168,76,0.4);
  background: rgba(201,168,76,0.04);
}
.field-inp::placeholder { color: var(--text-sub); }
.field-inp.pin-f { text-align: center; letter-spacing: 0.4em; font-size: 22px; }
.field-note {
  font-family: var(--mono); font-size: 10px;
  color: var(--text-sub); margin-top: 6px;
  letter-spacing: 0.03em; line-height: 1.5;
}

/* ── BUTTONS ── */
.btn-gold {
  width: 100%;
  padding: 16px 20px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  color: #0d0a00;
  border: none; border-radius: 12px;
  font-family: var(--sans);
  font-weight: 600; font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  letter-spacing: 0.02em;
  box-shadow: 0 4px 20px rgba(201,168,76,0.2);
}
.btn-gold:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(201,168,76,0.3); }
.btn-gold:active { transform: translateY(0); }
.btn-gold:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-glass {
  width: 100%;
  padding: 14px 20px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--text);
  border-radius: 12px;
  font-family: var(--sans);
  font-weight: 500; font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 10px;
}
.btn-glass:hover { border-color: rgba(201,168,76,0.3); background: var(--gold-glow); }

.btn-wa {
  width: 100%;
  padding: 13px;
  background: rgba(37,211,102,0.12);
  border: 1px solid rgba(37,211,102,0.25);
  color: #25D366;
  border-radius: 12px;
  font-family: var(--sans);
  font-weight: 600; font-size: 13px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-wa:hover { background: rgba(37,211,102,0.18); }

/* ── BENEFICIARY CARD ── */
.bene-card {
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.bene-card::before {
  content: '';
  position: absolute;
  top: -80px; right: -60px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(201,168,76,0.1) 0%, transparent 70%);
  pointer-events: none;
}

.bene-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3), transparent);
}

.bene-eyebrow {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-sub);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 6px;
}
.bene-eyebrow::before {
  content: '';
  width: 16px; height: 1px;
  background: var(--gold);
}

.bene-name {
  font-family: var(--serif);
  font-size: 34px;
  font-weight: 400;
  letter-spacing: -0.5px;
  line-height: 1;
  margin-bottom: 10px;
  color: var(--text);
}

.bene-phone {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  padding: 6px 14px;
  border-radius: 100px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
}
.bene-phone .op-dot {
  width: 8px; height: 8px; border-radius: 50%;
}

.amount-section {
  background: var(--void);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
  position: relative;
}
.amount-lbl {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-sub);
  margin-bottom: 8px;
}
.amount-val {
  font-family: var(--serif);
  font-size: 38px;
  font-weight: 300;
  color: var(--gold);
  line-height: 1;
  letter-spacing: -1px;
}
.amount-val small {
  font-size: 16px;
  color: var(--text-muted);
  font-weight: 300;
  margin-left: 4px;
}
.late-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 10px;
  color: var(--accent-red);
  margin-top: 6px;
}

/* ── PARTS SELECTOR ── */
.parts-wrap { margin-bottom: 14px; }
.parts-label {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-sub); margin-bottom: 8px;
}
.parts-row { display: flex; gap: 6px; }
.part-btn {
  flex: 1; padding: 10px 4px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 11px; font-weight: 400;
  cursor: pointer; transition: all 0.2s;
  text-align: center;
}
.part-btn.active {
  background: var(--gold-dim);
  border-color: rgba(201,168,76,0.4);
  color: var(--gold);
  font-weight: 500;
}

/* ── PROGRESS ── */
.progress-wrap { margin-bottom: 14px; }
.progress-meta {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10px;
  color: var(--text-sub); margin-bottom: 8px;
}
.progress-meta span:last-child { color: var(--gold); }
.progress-track {
  height: 3px;
  background: var(--glass-border);
  border-radius: 100px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: 100px;
  transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
  box-shadow: 0 0 8px rgba(201,168,76,0.4);
}

/* ── COUNTDOWN ── */
.countdown {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 6px;
}
.countdown .dot {
  width: 6px; height: 6px; border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

/* ── MOMO GUIDE ── */
.momo-wrap {
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 20px;
}
.momo-title {
  font-size: 13px; font-weight: 600;
  letter-spacing: -0.2px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.momo-title::before {
  content: ''; width: 3px; height: 16px;
  background: linear-gradient(var(--gold), var(--gold-light));
  border-radius: 2px; flex-shrink: 0;
}
.momo-ops { display: flex; gap: 8px; margin-bottom: 12px; }
.momo-op {
  flex: 1; padding: 10px;
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  background: var(--glass);
  cursor: pointer; transition: all 0.2s;
  text-align: center;
  font-family: var(--mono); font-size: 11px;
  color: var(--text-muted); font-weight: 400;
}
.momo-op.active-orange { background: rgba(255,107,0,0.1); border-color: rgba(255,107,0,0.3); color: #FF6B00; }
.momo-op.active-mtn { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: #F59E0B; }

.momo-modes { display: flex; margin-bottom: 16px; background: var(--void); border-radius: 10px; padding: 3px; }
.momo-mode {
  flex: 1; padding: 8px;
  font-family: var(--mono); font-size: 10px;
  background: none; border: none;
  color: var(--text-sub); cursor: pointer;
  border-radius: 8px; transition: all 0.2s;
  letter-spacing: 0.04em;
}
.momo-mode.active { background: var(--elevated); color: var(--text); }

.momo-steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.momo-step { display: flex; align-items: flex-start; gap: 12px; }
.step-n {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  flex-shrink: 0; margin-top: 1px;
  background: var(--glass); border: 1px solid var(--glass-border);
  color: var(--text-muted);
}
.step-n.og { background: rgba(255,107,0,0.1); border-color: rgba(255,107,0,0.2); color: #FF6B00; }
.step-n.mt { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.2); color: #F59E0B; }
.step-icon { font-size: 15px; flex-shrink: 0; }
.step-txt { font-size: 12px; color: var(--text-muted); line-height: 1.55; font-weight: 300; }
.step-txt b { color: var(--text); font-weight: 500; }

.btn-ussd {
  width: 100%; padding: 13px;
  border: none; border-radius: 11px;
  font-family: var(--sans); font-weight: 600; font-size: 13px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}

/* ── DECLARE PANEL ── */
.declare-panel {
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 20px;
}
.panel-title {
  font-size: 13px; font-weight: 600; letter-spacing: -0.2px;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.panel-title::before {
  content: ''; width: 3px; height: 16px;
  background: linear-gradient(var(--gold), var(--gold-light));
  border-radius: 2px; flex-shrink: 0;
}

/* ── STATUS BANNER ── */
.status-banner {
  padding: 14px 16px; border-radius: 12px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--sans);
}
.status-banner.g { background: rgba(46,204,113,0.08); border: 1px solid rgba(46,204,113,0.2); color: var(--accent-green); }
.status-banner.o { background: rgba(243,156,18,0.08); border: 1px solid rgba(243,156,18,0.2); color: var(--accent-orange); }
.status-banner.r { background: rgba(231,76,60,0.08); border: 1px solid rgba(231,76,60,0.2); color: var(--accent-red); }

/* ── SUMMARY GRID ── */
.sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sum-card {
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 14px; padding: 16px;
}
.sum-val {
  font-family: var(--serif); font-size: 22px;
  font-weight: 400; margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.sum-val.gold { color: var(--gold); }
.sum-val.green { color: var(--accent-green); }
.sum-val.orange { color: var(--accent-orange); }
.sum-lbl {
  font-family: var(--mono); font-size: 9px;
  color: var(--text-sub); letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ── SECTION HEADER ── */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.sec-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
.sec-count { font-family: var(--mono); font-size: 10px; color: var(--text-sub); }

/* ── PAYMENT ROWS ── */
.pay-item {
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 12px; padding: 14px 16px;
  display: flex; align-items: flex-start; justify-content: space-between;
  transition: border-color 0.2s; margin-bottom: 8px;
}
.pay-item:hover { border-color: rgba(201,168,76,0.2); }
.pay-name { font-size: 14px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 4px; }
.pay-meta { font-family: var(--mono); font-size: 10px; color: var(--text-sub); line-height: 1.6; }
.pay-amount {
  font-family: var(--serif); font-size: 16px; font-weight: 400;
  text-align: right; margin-bottom: 6px; letter-spacing: -0.3px;
}
.pay-amount.v { color: var(--accent-green); }
.pay-amount.p { color: var(--accent-orange); }
.pay-amount.r { color: var(--accent-red); }

.chip {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 6px;
  display: inline-block;
}
.chip.v { background: rgba(46,204,113,0.1); color: var(--accent-green); border: 1px solid rgba(46,204,113,0.2); }
.chip.p { background: rgba(243,156,18,0.1); color: var(--accent-orange); border: 1px solid rgba(243,156,18,0.2); }
.chip.r { background: rgba(231,76,60,0.1); color: var(--accent-red); border: 1px solid rgba(231,76,60,0.2); }

.btn-ok {
  background: rgba(201,168,76,0.1); color: var(--gold);
  border: 1px solid rgba(201,168,76,0.25);
  padding: 5px 10px; border-radius: 8px;
  font-family: var(--mono); font-size: 10px; cursor: pointer;
  transition: all 0.2s;
}
.btn-ok:hover { background: rgba(201,168,76,0.2); }
.btn-no {
  background: rgba(231,76,60,0.08); color: var(--accent-red);
  border: 1px solid rgba(231,76,60,0.15);
  padding: 5px 10px; border-radius: 8px;
  font-family: var(--mono); font-size: 10px; cursor: pointer;
}

/* ── SETTINGS ── */
.settings-card {
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 20px;
}
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── LICENSE BANNER ── */
.lic-banner {
  padding: 10px 16px; border-radius: 10px;
  font-family: var(--mono); font-size: 11px;
  display: flex; align-items: center; gap: 6px;
}
.lic-banner.ok { background: rgba(46,204,113,0.06); border: 1px solid rgba(46,204,113,0.15); color: #27ae60; }
.lic-banner.warn { background: rgba(243,156,18,0.06); border: 1px solid rgba(243,156,18,0.15); color: #d68910; }
.lic-banner.danger { background: rgba(231,76,60,0.06); border: 1px solid rgba(231,76,60,0.15); color: #c0392b; }

/* ── EMPTY STATE ── */
.empty {
  text-align: center; padding: 48px 0;
  font-family: var(--mono); font-size: 12px;
  color: var(--text-sub); line-height: 1.8;
}

/* ── NOTIF ── */
.notif {
  position: fixed; top: 0;
  left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 420px;
  padding: 14px 20px;
  text-align: center;
  font-family: var(--mono); font-size: 12px;
  z-index: 999; letter-spacing: 0.04em;
  backdrop-filter: blur(12px);
}
.notif.s { background: rgba(46,204,113,0.9); color: #fff; }
.notif.e { background: rgba(231,76,60,0.9); color: #fff; }

/* ── CHANGE PIN ── */
.change-pin-wrap { flex: 1; padding: 50px 24px 40px; }
.change-pin-title {
  font-family: var(--serif); font-size: 36px;
  font-weight: 300; letter-spacing: -0.5px;
  margin-bottom: 8px;
}
.change-pin-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; font-weight: 300; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace;color:#333;font-size:13px">
    Chargement…
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey:"AIzaSyBWYo9uz-ELYY-zouXT0-lyNXOrBBjZ8tU",
  authDomain:"cotisapp.firebaseapp.com",
  databaseURL:"https://cotisapp-default-rtdb.firebaseio.com",
  projectId:"cotisapp",
  storageBucket:"cotisapp.firebasestorage.app",
  messagingSenderId:"817783273140",
  appId:"1:817783273140:web:049a9cea3c86b3c0f9d8f4"
};

var DEVISE="FCFA", CREATOR="David Youdom", MAX_TRIES=3, LOCK_MS=5*60*1000;
var PARTS=[{l:"½",v:0.5},{l:"1",v:1},{l:"2",v:2},{l:"3",v:3}];
var OPS={
  orange:{label:"Orange Money",emoji:"🟠",color:"#FF6B00",
    su:function(p,a){return[
      {i:"📱",t:"Compose <b>#150*1*1*"+p+"*"+a+"*TON_PIN#</b> puis Appel"},
      {i:"✅",t:"Confirme l'envoi"},
      {i:"📩",t:"SMS de confirmation avec référence"},
      {i:"📋",t:"Copie la référence ci-dessous"}
    ];},
    sa:function(p,a){return[
      {i:"📲",t:"Ouvre l'appli <b>Orange Money</b>"},
      {i:"💸",t:"Transfert d'argent"},
      {i:"🔢",t:"Numéro <b>"+p+"</b> — <b>"+new Intl.NumberFormat("fr-FR").format(a)+" FCFA</b>"},
      {i:"🔑",t:"PIN et confirme"},
      {i:"📩",t:"Note la référence du SMS"}
    ];}
  },
  mtn:{label:"MTN MoMo",emoji:"🟡",color:"#F59E0B",
    su:function(p,a){return[
      {i:"📱",t:"Compose <b>*126*1*"+p+"*"+a+"#</b> puis Appel"},
      {i:"🔑",t:"Entre ton PIN MoMo"},
      {i:"✅",t:"Confirme"},
      {i:"📩",t:"SMS avec référence — copie-la ci-dessous"}
    ];},
    sa:function(p,a){return[
      {i:"📲",t:"Ouvre l'appli <b>MoMo</b>"},
      {i:"💸",t:"Envoyer de l'argent"},
      {i:"🔢",t:"Numéro <b>"+p+"</b> — <b>"+new Intl.NumberFormat("fr-FR").format(a)+" FCFA</b>"},
      {i:"🔑",t:"PIN et confirme"},
      {i:"📩",t:"Note la référence du SMS"}
    ];}
  }
};
var DS={montantBase:10000,montantAmende:1000,
  heureLimite:new Date(Date.now()+86400000).toISOString().slice(0,16),
  beneficiaryName:"À définir",beneficiaryPhone:"6XXXXXXXX",
  beneficiaryOperator:"orange",pinHash:hp("123456"),
  treasurerPhone:"",groupName:"Mon Groupe",totalMembers:10};

function hp(p){var h=0,s=p+"cotisapp_salt_2024";for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h=((h<<5)-h)+c;h=h&h;}return Math.abs(h).toString(36)+s.length.toString(36);}

var db=null,fbOk=false,cdT=null;
var S={
  screen:"license",role:null,pin:"",
  tries:parseInt(localStorage.getItem("pa")||"0"),
  lockUntil:parseInt(localStorage.getItem("pl")||"0"),
  licKey:localStorage.getItem("lk")||"",
  licData:null,licStatus:null,
  cfg:JSON.parse(JSON.stringify(DS)),pays:{},
  mName:localStorage.getItem("sn")||"",mPhone:localStorage.getItem("sp")||"",
  mOp:localStorage.getItem("so")||"orange",mRef:"",
  submitOk:null,notif:null,cd:"",tab:"paiement",
  gOp:"orange",gMode:"ussd",parts:1,np1:"",np2:""
};

function initFB(){
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.database();fbOk=true;
    if(S.licKey)valLic(S.licKey);else render();
  }catch(e){
    fbOk=false;
    var s=localStorage.getItem("cs"),p=localStorage.getItem("cp");
    if(s)S.cfg=JSON.parse(s);if(p)S.pays=JSON.parse(p);
    S.gOp=S.cfg.beneficiaryOperator;startCD();render();
  }
}

function saveL(){localStorage.setItem("cs",JSON.stringify(S.cfg));localStorage.setItem("cp",JSON.stringify(S.pays));}

function valLic(key){
  if(!fbOk){enterApp();return;}
  var kid=key.replace(/-/g,"_");
  db.ref("licenses/"+kid).once("value",function(snap){
    if(!snap.exists()){S.licStatus="invalid";S.licKey="";localStorage.removeItem("lk");showN("❌ Clé invalide","e");render();return;}
    var l=snap.val();
    if(l.revoked){S.licStatus="revoked";S.licKey="";localStorage.removeItem("lk");showN("🚫 Licence révoquée","e");render();return;}
    if(!l.activatedAt){
      var now=new Date().toISOString();
      var exp=new Date();exp.setMonth(exp.getMonth()+6);
      db.ref("licenses/"+kid).update({activatedAt:now,expiresAt:exp.toISOString()});
      l.activatedAt=now;l.expiresAt=exp.toISOString();
    }
    if(new Date()>new Date(l.expiresAt)){S.licStatus="expired";S.licData=l;S.licKey="";localStorage.removeItem("lk");showN("⏰ Licence expirée","e");render();return;}
    S.licData=l;S.licStatus="valid";S.licKey=key;localStorage.setItem("lk",key);
    enterApp();
  });
}

function gk(){return(S.licKey||"default").replace(/-/g,"_");}

function enterApp(){
  db.ref("groups/"+gk()+"/settings").on("value",function(snap){
    S.cfg=snap.exists()?snap.val():DS;
    if(!snap.exists())db.ref("groups/"+gk()+"/settings").set(DS);
    S.gOp=S.cfg.beneficiaryOperator;startCD();render();
  });
  db.ref("groups/"+gk()+"/payments").on("value",function(snap){
    S.pays=snap.exists()?snap.val():{};render();
  });
  S.screen="cgu";render();
}

function startCD(){if(cdT)clearInterval(cdT);updCD();cdT=setInterval(function(){updCD();var e=document.getElementById("cd");if(e)e.textContent=S.cd;},1000);}
function updCD(){
  var d=new Date(S.cfg.heureLimite)-new Date();
  if(d<=0){S.cd="Délai dépassé — amende active";return;}
  var h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);
  S.cd=h+"h "+String(m).padStart(2,"0")+"m "+String(s).padStart(2,"0")+"s restantes";
}

var fmt=function(v){return new Intl.NumberFormat("fr-FR").format(v)+" "+DEVISE;};
var late=function(){return new Date()>new Date(S.cfg.heureLimite);};
var due=function(){return Math.round((late()?Number(S.cfg.montantBase)+Number(S.cfg.montantAmende):Number(S.cfg.montantBase))*S.parts);};
var q=function(s){return document.querySelector(s);};
var locked=function(){return Date.now()<S.lockUntil;};
var lockSec=function(){return Math.max(0,Math.ceil((S.lockUntil-Date.now())/1000));};

function showN(msg,type){
  S.notif={msg:msg,type:type||"s"};render();
  setTimeout(function(){S.notif=null;var b=document.getElementById("notif-bar");if(b)b.style.opacity="0";},3000);
}
function set$(p){Object.keys(p).forEach(function(k){S[k]=p[k];});render();}

function tryAdmin(){
  if(locked()){showN("🔒 Bloqué — "+lockSec()+"s","e");return;}
  var pin=S.pin;
  if(pin.length<6){showN("PIN minimum 6 chiffres","e");return;}
  if(hp(pin)===(S.cfg.pinHash||hp("123456"))){
    S.tries=0;localStorage.removeItem("pa");localStorage.removeItem("pl");
    set$({screen:"app",role:"admin",pin:"",tab:"dashboard"});
  } else {
    S.tries++;localStorage.setItem("pa",S.tries);
    if(S.tries>=MAX_TRIES){S.lockUntil=Date.now()+LOCK_MS;localStorage.setItem("pl",S.lockUntil);S.tries=0;localStorage.setItem("pa","0");showN("🔒 3 échecs — bloqué 5 min","e");}
    else showN("PIN incorrect — "+(MAX_TRIES-S.tries)+" essai(s)","e");
    set$({pin:""});
  }
}

function changePIN(){
  var p1=S.np1,p2=S.np2;
  if(p1.length<6){showN("6 chiffres minimum","e");return;}
  if(p1!==p2){showN("PIN non identiques","e");return;}
  if(!/^\d+$/.test(p1)){showN("Chiffres uniquement","e");return;}
  saveCfg({pinHash:hp(p1)});
  set$({screen:"app",role:"admin",np1:"",np2:"",tab:"paramètres"});
  showN("✅ PIN modifié !");
}

function saveCfg(patch){
  Object.keys(patch).forEach(function(k){S.cfg[k]=patch[k];});
  if(fbOk)db.ref("groups/"+gk()+"/settings").set(S.cfg);else saveL();
}

function submitPay(){
  var n=S.mName.trim(),p=S.mPhone.trim(),r=S.mRef.trim();
  if(!n){showN("Entre ton nom","e");return;}
  if(!p){showN("Entre ton numéro","e");return;}
  if(!r){showN("Référence transaction obligatoire","e");return;}
  var ps=Object.values(S.pays);
  for(var i=0;i<ps.length;i++){if(ps[i].txRef===r&&ps[i].status!=="rejeté"){showN("⚠ Référence déjà utilisée","e");return;}}
  S.submitOk="loading";render();
  var pay={memberName:n,memberPhone:p,memberOperator:S.mOp,amount:due(),txRef:r,parts:S.parts,status:"en attente",createdAt:new Date().toISOString(),txId:"TX"+Math.random().toString(36).substr(2,8).toUpperCase()};
  localStorage.setItem("sn",n);localStorage.setItem("sp",p);localStorage.setItem("so",S.mOp);
  if(fbOk){
    db.ref("groups/"+gk()+"/payments").push(pay).then(function(){S.mRef="";S.submitOk=null;showN("✅ Déclaré ! Le trésorier va valider.");}).catch(function(){S.submitOk=null;showN("Erreur","e");});
  }else{S.pays[Date.now()]=pay;saveL();S.mRef="";S.submitOk=null;showN("✅ Déclaré !");render();}
}

function valPay(key){
  var p=S.pays[key];if(!p)return;
  if(fbOk)db.ref("groups/"+gk()+"/payments/"+key).update({status:"validé",validatedAt:new Date().toISOString()});
  else{S.pays[key].status="validé";saveL();render();}
  var msg="*✅ REÇU DE COTISATION — CotisApp*\n\nPaiement de *"+fmt(p.amount)+"* confirmé !\n👤 "+p.memberName+"\n🆔 "+p.txId+"\n📋 Réf: "+p.txRef+"\n\n_Par "+CREATOR+"_";
  window.open("https://wa.me/"+p.memberPhone.replace(/\D/g,"")+"?text="+encodeURIComponent(msg),"_blank");
}

function rejPay(key){
  var p=S.pays[key];if(!p)return;
  var reason=prompt("Raison du rejet :")||"";
  if(fbOk)db.ref("groups/"+gk()+"/payments/"+key).update({status:"rejeté",rejectReason:reason});
  else{S.pays[key].status="rejeté";S.pays[key].rejectReason=reason;saveL();render();}
  if(p.memberPhone){var msg="*❌ PAIEMENT REJETÉ*\n\n👤 "+p.memberName+"\n"+(reason?"📝 "+reason:"")+"\n\nContacte le trésorier.";window.open("https://wa.me/"+p.memberPhone.replace(/\D/g,"")+"?text="+encodeURIComponent(msg),"_blank");}
}

function sendProof(){
  var op=OPS[S.mOp]||OPS.orange,tp=S.cfg.treasurerPhone||"";
  var msg="*💳 PREUVE DE PAIEMENT — CotisApp*\n\n👤 *"+S.mName+"*\n📱 "+S.mPhone+"\n"+op.emoji+" "+op.label+"\n💰 *"+fmt(due())+"*\n📋 Réf: "+(S.mRef||"—")+"\n\n✅ Merci de valider.";
  if(tp)window.open("https://wa.me/"+tp.replace(/\D/g,"")+"?text="+encodeURIComponent(msg),"_blank");
  else showN("⚠ Numéro trésorier non configuré","e");
}

function momoHTML(){
  var op=OPS[S.gOp]||OPS.orange;
  var steps=S.gMode==="app"?op.sa(S.cfg.beneficiaryPhone,due()):op.su(S.cfg.beneficiaryPhone,due());
  var cls=S.gOp==="orange"?"og":"mt";
  var html=steps.map(function(s,i){return'<div class="momo-step"><div class="step-n '+cls+'">'+(i+1)+'</div><div class="step-icon">'+s.i+'</div><div class="step-txt">'+s.t+'</div></div>';}).join("");
  var ussd=S.gMode==="ussd"?'<button class="btn-ussd" id="btn-dial" style="background:'+op.color+'20;border:1px solid '+op.color+'40;color:'+op.color+'">📞 Composer le code USSD</button>':"";
  return'<div class="momo-steps">'+html+'</div>'+ussd;
}

function licDays(){
  if(!S.licData||!S.licData.expiresAt)return null;
  return Math.ceil((new Date(S.licData.expiresAt)-new Date())/86400000);
}

function fmtDate(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});}

/* ── RENDER ── */
function render(){
  var root=document.getElementById("root");if(!root)return;
  var pays=Object.entries(S.pays||{});
  var html="";
  if(S.screen==="license")html=sLicense();
  else if(S.screen==="cgu")html=sCGU();
  else if(S.screen==="portal")html=sPortal();
  else if(S.screen==="change_pin")html=sChangePin();
  else html=sApp(pays);
  root.innerHTML=html;
  bindEv(pays);
}

function notifH(){
  if(!S.notif)return"";
  return'<div id="notif-bar" class="notif '+S.notif.type+'">'+S.notif.msg+'</div>';
}

function topBar(right){
  return'<div class="top-bar"><div class="logo"><div class="logo-icon">🏦</div><span class="logo-text">Cotis<em>App</em></span></div>'+(right||"")+'</div>';
}

function sLicense(){
  var err="";
  if(S.licStatus==="invalid")err='<div class="lic-error">❌ Clé invalide ou inexistante</div>';
  if(S.licStatus==="expired")err='<div class="lic-error">⏰ Licence expirée — contacte '+CREATOR+' pour renouveler</div>';
  if(S.licStatus==="revoked")err='<div class="lic-error">🚫 Licence révoquée — contacte '+CREATOR+'</div>';
  return notifH()+'<div class="screen">'+topBar('<span style="font-family:var(--mono);font-size:10px;color:var(--text-sub)">v3.0</span>')+
  '<div class="license-screen"><div class="license-bg"></div><div class="license-content">'+
  '<div class="lic-eyebrow">Activation requise</div>'+
  '<h1 class="lic-title">Entre ta<br>clé de<br><em>licence.</em></h1>'+
  '<p class="lic-sub">Chaque groupe possède sa propre clé unique fournie par le créateur. Valable 6 mois après activation.</p>'+
  err+
  '<div class="field"><label class="field-lbl">🔑 Clé de licence</label><input id="lic-in" class="field-inp" placeholder="YOUDOM-2026-XXXX-XXXX" value="'+S.licKey+'" style="letter-spacing:.08em;text-transform:uppercase"/></div>'+
  '<button class="btn-gold" id="btn-activate">Activer la licence</button>'+
  '<p class="lic-footer">Une application par <strong>'+CREATOR+'</strong></p>'+
  '</div></div></div>';
}

function sCGU(){
  return notifH()+'<div class="screen">'+topBar()+
  '<div class="cgu-content">'+
  '<div class="section-label">Contrat</div>'+
  '<h1 class="cgu-heading">Avant de<br><em>commencer.</em></h1>'+
  '<div class="cgu-item"><div class="cgu-num-big">01</div><div class="cgu-item-body"><div class="cgu-item-title">Pont de Paiement</div><div class="cgu-item-text">L\'argent circule via Orange Money ou MTN MoMo. CotisApp assure le suivi, pas le transfert.</div></div></div>'+
  '<div class="cgu-item"><div class="cgu-num-big">02</div><div class="cgu-item-body"><div class="cgu-item-title">Parts & Amendes</div><div class="cgu-item-text">Choisis ton nombre de noms. Les amendes s\'appliquent automatiquement après le délai fixé.</div></div></div>'+
  '<div class="cgu-item"><div class="cgu-num-big">03</div><div class="cgu-item-body"><div class="cgu-item-title">Validation Trésorier</div><div class="cgu-item-text">Le Trésorier valide chaque paiement. Reçu WhatsApp automatique à la confirmation.</div></div></div>'+
  '<button class="btn-gold" id="btn-agree">J\'accepte et continuer</button></div></div>';
}

function sPortal(){
  var lk=locked();
  var warn=lk?'<div class="pin-warn r">🔒 Bloqué — '+lockSec()+'s</div>':S.tries>0?'<div class="pin-warn o">⚠ '+(MAX_TRIES-S.tries)+' tentative(s) restante(s)</div>':"";
  var grp=S.licData?'<div style="font-family:var(--mono);font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:24px;letter-spacing:.06em">GROUPE : <span style="color:var(--gold)">'+(S.licData.groupName||"—")+'</span></div>':"";
  return notifH()+'<div class="screen">'+topBar()+
  '<div class="portal-content">'+grp+
  '<div class="portal-tag">🇨🇲 Tontine Digitale</div>'+
  '<h1 class="portal-heading"><span class="outline">Qui</span><br><span class="gold">êtes-</span><br>vous ?</h1>'+
  '<button class="btn-glass" id="btn-member">👥 Entrer comme Membre</button>'+
  '<div class="sep"><div class="sep-line"></div><span class="sep-text">OU</span><div class="sep-line"></div></div>'+
  '<div class="field"><label class="field-lbl">🔐 PIN Trésorier (min. 6 chiffres)</label><input id="pin-in" type="password" inputmode="numeric" placeholder="••••••" value="'+S.pin+'" class="field-inp pin-f" maxlength="12"'+(lk?" disabled":"")+"/>"+warn+"</div>"+
  '<button class="btn-gold" id="btn-admin"'+(lk?" disabled":"")+'>Accès Administration</button>'+
  '<p class="portal-hint">PIN par défaut : 123456</p></div></div>';
}

function sChangePin(){
  return notifH()+'<div class="screen">'+topBar('<button class="btn-exit" id="btn-back">← Retour</button>')+
  '<div class="change-pin-wrap">'+
  '<h1 class="change-pin-title">Changer<br>le <em style="color:var(--gold);font-style:italic">PIN</em></h1>'+
  '<p class="change-pin-sub">Chiffres uniquement, minimum 6 caractères.</p>'+
  '<div class="field"><label class="field-lbl">Nouveau PIN</label><input id="np1" type="password" inputmode="numeric" placeholder="••••••" value="'+S.np1+'" class="field-inp pin-f" maxlength="12"/></div>'+
  '<div class="field"><label class="field-lbl">Confirmer</label><input id="np2" type="password" inputmode="numeric" placeholder="••••••" value="'+S.np2+'" class="field-inp pin-f" maxlength="12"/></div>'+
  '<button class="btn-gold" id="btn-save-pin">Enregistrer le PIN</button></div></div>';
}

function sApp(pays){
  var isA=S.role==="admin";
  var op=OPS[S.cfg.beneficiaryOperator]||OPS.orange;
  var gop=OPS[S.gOp]||OPS.orange;
  var pend=pays.filter(function(e){return e[1].status==="en attente";});
  var val=pays.filter(function(e){return e[1].status==="validé";});
  var coll=val.reduce(function(s,e){return s+Number(e[1].amount);},0);
  var exp=Number(S.cfg.totalMembers||10)*Number(S.cfg.montantBase);
  var pct=exp>0?Math.min(100,Math.round(coll/exp*100)):0;
  var rate=pays.length>0?Math.round(val.length/pays.length*100):0;
  var myL=null;
  for(var i=pays.length-1;i>=0;i--){if(pays[i][1].memberPhone===S.mPhone||pays[i][1].memberName===S.mName){myL=pays[i][1];break;}}
  var myS=myL?myL.status:null;
  var tabs=isA?["dashboard","liste","paramètres"]:["paiement","historique"];
  var aTab=S.tab||tabs[0];
  var tabBar='<div class="tab-bar">'+tabs.map(function(t){return'<button class="tab-btn'+(aTab===t?" active":"")+'" data-tab="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</button>';}).join("")+'</div>';
  var days=licDays();
  var licB="";
  if(days!==null){var cls=days>30?"ok":days>7?"warn":"danger";licB='<div class="lic-banner '+cls+'">🔑 Licence — '+days+' jour'+(days>1?"s":"")+" restant"+(days>1?"s":"")+'</div>';}
  var content="";

  if(!isA&&aTab==="paiement"){
    var sB=myS?'<div class="status-banner '+(myS==="validé"?"g":myS==="rejeté"?"r":"o")+'">'+(myS==="validé"?"✅ Paiement confirmé":myS==="rejeté"?"❌ Rejeté — contacte le trésorier":"⏳ En attente de validation")+'</div>':"";
    var partsH=PARTS.map(function(p){return'<button class="part-btn'+(S.parts===p.v?" active":"")+'" data-p="'+p.v+'">'+p.l+' nom'+(p.v>1?"s":"")+'</button>';}).join("");
    var opDot='<span class="op-dot" style="background:'+(op.color||"#888")+'"></span>';
    content=sB+
    '<div class="bene-card">'+
      '<div class="bene-eyebrow">Bénéficiaire du jour</div>'+
      '<div class="bene-name">'+S.cfg.beneficiaryName+'</div>'+
      '<div class="bene-phone">'+opDot+op.emoji+' '+S.cfg.beneficiaryPhone+'</div>'+
      '<div class="amount-section">'+
        '<div class="amount-lbl">Montant à verser</div>'+
        '<div class="amount-val">'+new Intl.NumberFormat("fr-FR").format(due())+'<small>FCFA</small></div>'+
        (late()?'<div class="late-tag">⚠ Amende retard incluse</div>':"")+
      '</div>'+
      '<div class="parts-wrap"><div class="parts-label">Nombre de noms (parts)</div><div class="parts-row">'+partsH+'</div></div>'+
      '<div class="progress-wrap">'+
        '<div class="progress-meta"><span>Cagnotte du groupe</span><span>'+pct+'%</span></div>'+
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
      '</div>'+
      '<div class="countdown"><span class="dot" style="background:'+(late()?"var(--accent-red)":"var(--gold)")+'"></span><span id="cd" style="color:'+(late()?"var(--accent-red)":"var(--text-muted)")+'">'+S.cd+'</span></div>'+
      '<button class="btn-gold" id="btn-copy" style="margin-bottom:8px">📋 Copier le numéro</button>'+
      '<button class="btn-wa" id="btn-proof">📤 Envoyer preuve au trésorier</button>'+
    '</div>'+
    '<div class="momo-wrap">'+
      '<div class="momo-title">Comment payer ?</div>'+
      '<div class="momo-ops">'+
        '<button class="momo-op'+(S.gOp==="orange"?" active-orange":"")+'" data-op="orange">🟠 Orange Money</button>'+
        '<button class="momo-op'+(S.gOp==="mtn"?" active-mtn":"")+'" data-op="mtn">🟡 MTN MoMo</button>'+
      '</div>'+
      '<div class="momo-modes">'+
        '<button class="momo-mode'+(S.gMode==="ussd"?" active":"")+'" data-mode="ussd">📱 Code USSD</button>'+
        '<button class="momo-mode'+(S.gMode==="app"?" active":"")+'" data-mode="app">📲 Via l\'appli</button>'+
      '</div>'+
      momoHTML()+
    '</div>'+
    '<div class="declare-panel">'+
      '<div class="panel-title">Déclarer mon paiement</div>'+
      '<div class="field"><label class="field-lbl">Nom complet</label><input id="mn" class="field-inp" placeholder="Ex: Amina Nkeng" value="'+S.mName+'"/></div>'+
      '<div class="field"><label class="field-lbl">Numéro</label><input id="mp" class="field-inp" placeholder="6XXXXXXXX" value="'+S.mPhone+'" inputmode="numeric"/></div>'+
      '<div class="field"><label class="field-lbl">Opérateur</label><select id="mo" class="field-inp">'+Object.entries(OPS).map(function(e){return'<option value="'+e[0]+'"'+(S.mOp===e[0]?" selected":"")+'> '+e[1].emoji+' '+e[1].label+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label class="field-lbl">⚠ Référence transaction (SMS reçu)</label><input id="mr" class="field-inp" placeholder="Ex: MP241028XXXXX" value="'+S.mRef+'"/><p class="field-note">Visible dans le SMS de confirmation de l\'opérateur</p></div>'+
      '<button class="btn-gold" id="btn-sub"'+(S.submitOk==="loading"?" disabled":"")+'>'+(S.submitOk==="loading"?"⏳ Envoi en cours…":"✅ Confirmer mon paiement")+'</button>'+
    '</div>';
  }

  if(!isA&&aTab==="historique"){
    content='<div class="sec-head"><div class="sec-title">Historique</div><span class="sec-count">'+pays.length+' paiement'+(pays.length>1?"s":"")+'</span></div>'+
    (pays.length===0?'<div class="empty">Aucun paiement<br>enregistré pour cette session.</div>':pays.map(function(e){return rowH(e[0],e[1],false);}).join(""));
  }

  if(isA&&aTab==="dashboard"){
    content=licB+
    '<div class="bene-card">'+
      '<div class="bene-eyebrow">'+S.cfg.groupName+'</div>'+
      '<div class="bene-name">'+S.cfg.beneficiaryName+'</div>'+
      '<div class="bene-phone"><span class="op-dot" style="background:'+(op.color||"#888")+'"></span>'+op.emoji+' '+S.cfg.beneficiaryPhone+'</div>'+
      '<div class="amount-section"><div class="amount-lbl">Cotisation de base</div><div class="amount-val">'+new Intl.NumberFormat("fr-FR").format(S.cfg.montantBase)+'<small>FCFA</small></div>'+(late()?'<div class="late-tag">⚠ Amende active</div>':"")+
      '</div>'+
      '<div class="progress-wrap">'+
        '<div class="progress-meta"><span>Progression cagnotte</span><span>'+pct+'%</span></div>'+
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
      '</div>'+
      '<div class="countdown"><span class="dot" style="background:'+(late()?"var(--accent-red)":"var(--gold)")+'"></span><span id="cd" style="color:'+(late()?"var(--accent-red)":"var(--text-muted)")+'">'+S.cd+'</span></div>'+
    '</div>'+
    '<div class="sum-grid">'+
      '<div class="sum-card"><div class="sum-val gold">'+fmt(coll)+'</div><div class="sum-lbl">Collecté</div></div>'+
      '<div class="sum-card"><div class="sum-val orange">'+pend.length+'</div><div class="sum-lbl">En attente</div></div>'+
      '<div class="sum-card"><div class="sum-val green">'+val.length+'/'+pays.length+'</div><div class="sum-lbl">Validés</div></div>'+
      '<div class="sum-card"><div class="sum-val">'+rate+'%</div><div class="sum-lbl">Taux collect.</div></div>'+
    '</div>'+
    (pend.length>0?'<div class="sec-head"><div class="sec-title">⏳ À valider</div><span class="sec-count">'+pend.length+'</span></div>'+pend.map(function(e){return rowH(e[0],e[1],true);}).join(""):'<div class="empty">✅ Tout est traité !</div>');
  }

  if(isA&&aTab==="liste"){
    content='<div class="sec-head"><div class="sec-title">Tous les paiements</div><span class="sec-count">'+pays.length+'</span></div>'+
    (pays.length===0?'<div class="empty">Aucun paiement.</div>':pays.map(function(e){return rowH(e[0],e[1],true);}).join(""));
  }

  if(isA&&aTab==="paramètres"){
    content=licB+
    '<div class="settings-card"><div class="panel-title">Session</div>'+
    '<div class="field"><label class="field-lbl">Nom du groupe</label><input id="sg" class="field-inp" value="'+S.cfg.groupName+'"/></div>'+
    '<div class="field"><label class="field-lbl">Bénéficiaire</label><input id="sn" class="field-inp" value="'+S.cfg.beneficiaryName+'"/></div>'+
    '<div class="field"><label class="field-lbl">Numéro bénéficiaire</label><input id="sp" class="field-inp" value="'+S.cfg.beneficiaryPhone+'" inputmode="numeric"/></div>'+
    '<div class="field"><label class="field-lbl">Opérateur</label><select id="so" class="field-inp">'+Object.entries(OPS).map(function(e){return'<option value="'+e[0]+'"'+(S.cfg.beneficiaryOperator===e[0]?" selected":"")+'>'+e[1].emoji+' '+e[1].label+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label class="field-lbl">Numéro trésorier (WhatsApp)</label><input id="st" class="field-inp" value="'+(S.cfg.treasurerPhone||"")+'" inputmode="numeric" placeholder="6XXXXXXXX"/></div>'+
    '<div class="two-col">'+
      '<div class="field"><label class="field-lbl">Cotisation (FCFA)</label><input id="sb" type="number" class="field-inp" value="'+S.cfg.montantBase+'"/></div>'+
      '<div class="field"><label class="field-lbl">Amende (FCFA)</label><input id="sa" type="number" class="field-inp" value="'+S.cfg.montantAmende+'"/></div>'+
    '</div>'+
    '<div class="field"><label class="field-lbl">Nb membres (progression)</label><input id="sm" type="number" class="field-inp" value="'+(S.cfg.totalMembers||10)+'"/></div>'+
    '<div class="field"><label class="field-lbl">Heure limite</label><input id="sh" type="datetime-local" class="field-inp" value="'+S.cfg.heureLimite+'"/></div>'+
    '<button class="btn-gold" id="btn-save">💾 Sauvegarder</button></div>'+
    '<div class="settings-card"><div class="panel-title">Sécurité</div>'+
    '<button class="btn-glass" id="btn-chpin" style="margin-bottom:0">🔐 Changer le PIN</button></div>'+
    '<div style="text-align:center;font-family:var(--mono);font-size:10px;color:var(--text-sub);letter-spacing:.06em">'+(fbOk?"🔥 Firebase — temps réel":"⚠ Mode local")+'<br>App par <span style="color:var(--gold)">'+CREATOR+'</span></div>';
  }

  return notifH()+
  '<div class="screen">'+
  topBar('<div class="top-right"><span class="role-badge">'+(isA?"Trésorier":"Membre")+'</span><button class="btn-exit" id="btn-quit">Sortir</button></div>')+
  tabBar+
  '<div class="app-body">'+content+'</div></div>';
}

function rowH(key,p,isA){
  var sc=p.status==="validé"?"v":p.status==="rejeté"?"r":"p";
  var em=p.status==="validé"?"✅":p.status==="rejeté"?"❌":"⏳";
  var opE=OPS[p.memberOperator]?OPS[p.memberOperator].emoji:"";
  var pL=p.parts&&p.parts!==1?" · "+p.parts+" noms":"";
  return'<div class="pay-item">'+
  '<div style="flex:1;min-width:0">'+
    '<div class="pay-name">'+p.memberName+pL+'</div>'+
    '<div class="pay-meta">#'+p.txId+'<br>📋 '+(p.txRef||"—")+'<br>'+opE+' '+p.memberPhone+'</div>'+
  '</div>'+
  '<div style="text-align:right;flex-shrink:0;margin-left:12px">'+
    '<div class="pay-amount '+sc+'">'+fmt(p.amount)+'</div>'+
    '<span class="chip '+sc+'">'+em+' '+p.status+'</span>'+
    (isA&&p.status==="en attente"?'<div style="display:flex;gap:4px;justify-content:flex-end;margin-top:6px"><button class="btn-ok" data-key="'+key+'">✓ Ok</button><button class="btn-no" data-key="'+key+'">✕</button></div>':"")+
    (p.rejectReason?'<div style="font-family:var(--mono);font-size:9px;color:var(--accent-red);margin-top:4px">'+p.rejectReason+'</div>':"")+
  '</div></div>';
}

function bindEv(pays){
  var el;
  el=q("#lic-in");if(el){el.addEventListener("input",function(e){S.licKey=e.target.value.toUpperCase();});el.addEventListener("keydown",function(e){if(e.key==="Enter")valLic(S.licKey.trim());});}
  el=q("#btn-activate");if(el)el.addEventListener("click",function(){valLic(S.licKey.trim());});
  el=q("#btn-agree");if(el)el.addEventListener("click",function(){set$({screen:"portal"});});
  el=q("#btn-member");if(el)el.addEventListener("click",function(){set$({screen:"app",role:"member",tab:"paiement"});});
  el=q("#pin-in");if(el){el.addEventListener("input",function(e){S.pin=e.target.value;});el.addEventListener("keydown",function(e){if(e.key==="Enter")tryAdmin();});}
  el=q("#btn-admin");if(el)el.addEventListener("click",tryAdmin);
  el=q("#btn-quit");if(el)el.addEventListener("click",function(){set$({screen:"portal",role:null,pin:""});});
  el=q("#btn-back");if(el)el.addEventListener("click",function(){set$({screen:"app",role:"admin",tab:"paramètres"});});
  document.querySelectorAll(".tab-btn").forEach(function(b){b.addEventListener("click",function(){set$({tab:b.dataset.tab});});});
  el=q("#btn-copy");if(el)el.addEventListener("click",function(){
    navigator.clipboard.writeText(S.cfg.beneficiaryPhone).catch(function(){});
    showN("✅ Numéro "+S.cfg.beneficiaryPhone+" copié !");
  });
  el=q("#btn-proof");if(el)el.addEventListener("click",sendProof);
  document.querySelectorAll(".part-btn").forEach(function(b){b.addEventListener("click",function(){set$({parts:parseFloat(b.dataset.p)});});});
  document.querySelectorAll(".momo-op").forEach(function(b){b.addEventListener("click",function(){set$({gOp:b.dataset.op});});});
  document.querySelectorAll(".momo-mode").forEach(function(b){b.addEventListener("click",function(){set$({gMode:b.dataset.mode});});});
  el=q("#btn-dial");if(el)el.addEventListener("click",function(){
    var ph=S.cfg.beneficiaryPhone,am=due();
    var u=S.gOp==="orange"?"tel:%23150*1*1*"+ph+"*"+am+"*":"tel:*126*1*"+ph+"*"+am+"%23";
    window.location.href=u;
  });
  el=q("#mn");if(el)el.addEventListener("input",function(e){S.mName=e.target.value;});
  el=q("#mp");if(el)el.addEventListener("input",function(e){S.mPhone=e.target.value;});
  el=q("#mo");if(el)el.addEventListener("change",function(e){S.mOp=e.target.value;});
  el=q("#mr");if(el)el.addEventListener("input",function(e){S.mRef=e.target.value;});
  el=q("#btn-sub");if(el)el.addEventListener("click",submitPay);
  el=q("#btn-save");if(el)el.addEventListener("click",function(){
    saveCfg({
      groupName:q("#sg")?.value||S.cfg.groupName,
      beneficiaryName:q("#sn")?.value||S.cfg.beneficiaryName,
      beneficiaryPhone:q("#sp")?.value||S.cfg.beneficiaryPhone,
      beneficiaryOperator:q("#so")?.value||S.cfg.beneficiaryOperator,
      treasurerPhone:q("#st")?.value||S.cfg.treasurerPhone,
      montantBase:Number(q("#sb")?.value)||S.cfg.montantBase,
      montantAmende:Number(q("#sa")?.value)||S.cfg.montantAmende,
      totalMembers:Number(q("#sm")?.value)||S.cfg.totalMembers,
      heureLimite:q("#sh")?.value||S.cfg.heureLimite,
    });
    showN("✅ Paramètres sauvegardés !");
  });
  el=q("#btn-chpin");if(el)el.addEventListener("click",function(){set$({screen:"change_pin",np1:"",np2:""});});
  el=q("#np1");if(el)el.addEventListener("input",function(e){S.np1=e.target.value;});
  el=q("#np2");if(el)el.addEventListener("input",function(e){S.np2=e.target.value;});
  el=q("#btn-save-pin");if(el)el.addEventListener("click",changePIN);
  document.querySelectorAll(".btn-ok").forEach(function(b){b.addEventListener("click",function(){valPay(b.dataset.key);});});
  document.querySelectorAll(".btn-no").forEach(function(b){b.addEventListener("click",function(){rejPay(b.dataset.key);});});
}

window.addEventListener("DOMContentLoaded",function(){render();initFB();});
</script>
