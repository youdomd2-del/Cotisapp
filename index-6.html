<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>CotisApp — Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0e0e0e;
  --card:#1a1a1a;
  --card2:#242424;
  --border:rgba(201, 168, 76, 0.15);
  --gold:#c9a84c;
  --gold-grad:linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
  --green:#22c55e;
  --red:#ef4444;
  --text1:#ffffff;
  --text2:#e0e0e0;
  --text3:#a0a0a0;
}
body{background:var(--bg);color:var(--text1);font-family:'Inter',sans-serif;line-height:1.5;overflow-x:hidden;}
button,input,select{font-family:inherit;}

/* --- Écran de Langue --- */
#lang-overlay {
  position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:10000;
  display:flex;flex-direction:column;justify-content:center;align-items:center;transition:0.5s;
}
.lang-box {
  background:var(--card);width:85%;max-width:320px;padding:25px;border-radius:24px;
  border:1px solid var(--border);text-align:center;
}
.lang-btn {
  width:100%;padding:15px;margin:10px 0;border-radius:16px;border:1px solid var(--border);
  background:var(--card2);color:var(--text1);display:flex;align-items:center;gap:15px;cursor:pointer;
}

/* --- Badges de Statut --- */
.st-pill { padding:4px 10px; border-radius:12px; font-size:10px; font-weight:800; text-transform:uppercase; border:1px solid; }
.st-ok { background:rgba(34,197,94,0.1); color:var(--green); border-color:var(--green); }
.st-late { background:rgba(201,168,76,0.1); color:var(--gold); border-color:var(--gold); }
.st-fail { background:rgba(239,68,68,0.1); color:var(--red); border-color:var(--red); }

.op-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:5px; }
.mtn-dot { background:#FFCC00; box-shadow:0 0 5px #FFCC00; }
.orange-dot { background:#FF6600; box-shadow:0 0 5px #FF6600; }

/* --- Header --- */
.app-header{padding:20px;display:flex;justify-content:space-between;align-items:center;background:var(--bg);}
.logo-c { 
  width:40px;height:40px;border:2px solid var(--gold);border-radius:50%;
  display:flex;justify-content:center;align-items:center;color:var(--gold);font-weight:900;
}

/* --- Cartes --- */
.container { width:92%; max-width:480px; margin:0 auto; }
.hero-card {
  background:var(--gold-grad); border-radius:24px; padding:25px; color:#000;
  box-shadow:0 15px 30px rgba(0,0,0,0.4); margin-bottom:25px;
}
.stat-item {
  background:var(--card); padding:16px; border-radius:18px; margin-bottom:12px;
  display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border);
}

.btn-main {
  width:100%; padding:18px; border-radius:16px; border:none; background:var(--gold-grad);
  color:#000; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-top:10px;
}
</style>
</head>
<body>

<div id="lang-overlay">
    <div class="lang-box">
        <div class="logo-c" style="margin:0 auto 20px; width:60px; height:60px; font-size:24px;">C</div>
        <h2 style="margin-bottom:20px; font-size:18px;">Choose Language / Langue</h2>
        <div class="lang-btn" onclick="initApp('fr')"><span>🇫🇷</span> <b>Français</b></div>
        <div class="lang-btn" onclick="initApp('en')"><span>🇬🇧</span> <b>English</b></div>
    </div>
</div>

<div id="app-root"></div>

<script>
// --- CONFIGURATION FIREBASE (REMPLACE PAR TES CLES SI BESOIN) ---
const firebaseConfig = { databaseURL: "https://cotisapp-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let S = {
    lang: localStorage.getItem('cotis_lang') || null,
    members: [
        {id:1, name:"David Kamgang", phone:"670000000", op:"mtn", lastPay:"2026-04-25", paid:true},
        {id:2, name:"Inès Youdom", phone:"690000000", op:"orange", lastPay:"2026-04-20", paid:false}
    ]
};

const T = {
    fr: { welcome: "Bienvenue", pot: "Cagnotte Totale", members: "Membres", statusOk: "À JOUR", statusLate: "RETARD", statusFail: "ÉCHEC", btn: "NOUVELLE COTISATION" },
    en: { welcome: "Welcome", pot: "Total Pot", members: "Members", statusOk: "ON TIME", statusLate: "LATE", statusFail: "FAILED", btn: "NEW CONTRIBUTION" }
};

function initApp(l) {
    S.lang = l;
    localStorage.setItem('cotis_lang', l);
    document.getElementById('lang-overlay').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('lang-overlay').style.display = 'none';
        render();
    }, 500);
}

function getStatus(date, paid) {
    if(paid) return `<span class="st-pill st-ok">${T[S.lang].statusOk}</span>`;
    const diff = Math.floor((new Date() - new Date(date)) / (1000*60*60*24));
    if(diff <= 0) return `<span class="st-pill st-ok">${T[S.lang].statusOk}</span>`;
    if(diff <= 5) return `<span class="st-pill st-late">${T[S.lang].statusLate} ${diff}j</span>`;
    return `<span class="st-pill st-fail">${T[S.lang].statusFail}</span>`;
}

function render() {
    const t = T[S.lang];
    const membersHTML = S.members.map(m => `
        <div class="stat-item">
            <div>
                <div style="font-weight:700;">${m.name} <span class="op-dot ${m.op}-dot"></span></div>
                <div style="font-size:12px; color:var(--text3);">${m.phone}</div>
            </div>
            ${getStatus(m.lastPay, m.paid)}
        </div>
    `).join('');

    document.getElementById('app-root').innerHTML = `
        <div class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="logo-c">C</div>
                <b style="letter-spacing:1px;">COTISAPP</b>
            </div>
            <i class="fa-solid fa-gear" style="color:var(--gold); font-size:20px;"></i>
        </div>
        <div class="container">
            <div class="hero-card">
                <div style="font-size:12px; font-weight:700; opacity:0.7;">${t.pot}</div>
                <div style="font-size:32px; font-weight:900;">1 250 000 <small style="font-size:14px;">FCFA</small></div>
            </div>
            <h3 style="font-size:13px; color:var(--gold); margin-bottom:15px; letter-spacing:1px;">${t.members.toUpperCase()}</h3>
            ${membersHTML}
            <button class="btn-main">${t.btn}</button>
        </div>
    `;
}

if(S.lang) initApp(S.lang);
</script>
</body>
</html>
